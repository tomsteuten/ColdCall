<!doctype html>
<html lang="en">
<head>
  <base href="../">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cold Call — Screen UI Preview</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <main id="app"></main>
  <script>
    addEventListener('error', (event) => {
      document.querySelector('#app').textContent = `Preview error: ${event.message}`;
    });
    addEventListener('unhandledrejection', (event) => {
      document.querySelector('#app').textContent = `Preview error: ${event.reason?.message ?? event.reason}`;
    });
  </script>
  <script type="module">
    const [{ defaultState }, { loadGameData }, jobUi, shopUi, codexUi, { startJob }, { mulberry32 }] = await Promise.all([
      import('./js/state.js'),
      import('./js/faults.js'),
      import('./js/ui/job.js'),
      import('./js/ui/shop.js'),
      import('./js/ui/codex.js'),
      import('./js/diagnosis.js'),
      import('./js/rng.js'),
    ]);
    const { faults, machines, clients } = await loadGameData('./data/');
    const state = defaultState();
    const params = new URLSearchParams(location.search);
    const screen = params.get('screen') ?? 'home';
    const fixture = params.get('state') ?? 'mature';
    const app = document.querySelector('#app');
    const noop = () => {};

    const today = new Date(Date.now());
    const date = (offset) => new Date(today.getTime() + offset * 86400000).toISOString().slice(0, 10);

    if (!['first', 'first-tech', 'first-tech-hired', 'tech-miss'].includes(fixture)) {
      state.player.cash = 7420;
      state.player.reputation = 42;
      state.player.tierUnlocked = 3;
      state.player.lifetimeEarnings = 18500;
      state.van.slots = 6;
      state.van.stock['generic-parts'] = 3;
      state.stats.jobsCompleted = 38;
      state.stats.cleanStreak = 7;
      state.tools.multimeterTier = 2;
      state.routes = [
        { id: 'burgertown-south', clientId: 'burgertown-high-st' },
        { id: 'froyo-strip', clientId: 'yo-go-froyo' },
      ];
      state.techs = [
        { id: 'tech-1', name: 'Dave', skill: 2, routeId: 'burgertown-south', hiredAt: Date.now() - 12 * 86400000 },
        { id: 'tech-2', name: 'Priya', skill: 1, routeId: 'froyo-strip', hiredAt: Date.now() - 4 * 86400000 },
      ];
      state.workshop.machines = [
        { id: 'preview-broken', machineType: 'soft-serve-commercial', faultId: 'barrel-freeze-up', status: 'broken' },
        { id: 'preview-ready', machineType: 'slushie-machine', faultId: 'slushie-condenser-clogged', status: 'repaired' },
      ];
      state.contract = {
        date: new Date(Date.now()).toISOString().slice(0, 10),
        machineType: 'soft-serve-commercial',
        count: 3,
        reward: 300,
        progress: 2,
        paid: false,
      };

      const ids = Object.keys(faults);
      for (const id of ids.slice(0, 14)) state.codex.fixes[id] = 1 + (id.length % 3);

      state.jobs.callbacks = [
        {
          faultId: 'mix-feed-valve-stuck-closed',
          clientId: 'burgertown-high-st',
          dueDay: date(0),
          expiryDay: date(3),
          misses: 1,
          source: 'player',
          evidence: ['error-log'],
        },
        {
          faultId: 'slushie-condenser-clogged',
          clientId: 'kwik-stop-corner',
          dueDay: date(0),
          expiryDay: date(3),
          misses: 1,
          source: 'tech',
          techName: 'Dave',
          evidence: null,
        },
        {
          faultId: 'froyo-thermistor-drift',
          clientId: 'yo-go-froyo',
          dueDay: date(1),
          expiryDay: date(4),
          misses: 1,
          source: 'tech',
          techName: 'Priya',
          evidence: null,
        },
      ];
    }

    if (fixture === 'first-tech' || fixture === 'first-tech-hired' || fixture === 'tech-miss') {
      state.player.cash = 1850;
      state.player.reputation = 12;
      state.player.tierUnlocked = 2;
      state.player.lifetimeEarnings = 3920;
      state.stats.jobsCompleted = 14;
      state.stats.cleanStreak = 3;
      state.tools.multimeterTier = 2;
      state.routes = [{ id: 'burgertown-south', clientId: 'burgertown-high-st' }];
      state.techs = [
        { id: 'tech-1', name: 'Dave', skill: 1, routeId: 'burgertown-south', hiredAt: Date.now() },
      ];
      state.workshop.machines = [];
      state.contract = {
        date: date(0),
        machineType: 'slushie-machine',
        count: 2,
        reward: 80,
        progress: 0,
        paid: false,
      };
      if (fixture === 'tech-miss') {
        state.jobs.callbacks = [{
          faultId: 'slushie-condenser-clogged',
          clientId: 'burgertown-high-st',
          dueDay: date(0),
          expiryDay: date(3),
          misses: 1,
          source: 'tech',
          techId: 'tech-1',
          techName: 'Dave',
          evidence: null,
        }];
      }
    }

    if (fixture === 'workshop-empty') {
      state.player.tierUnlocked = 2;
      state.workshop.machines = [];
    } else if (fixture === 'workshop-active') {
      state.workshop.machines = [
        { id: 'preview-waiting', machineType: 'soft-serve-commercial', faultId: 'barrel-freeze-up', status: 'broken' },
        { id: 'preview-active', machineType: 'slushie-machine', faultId: 'slushie-motor-brushes-worn', status: 'broken' },
        { id: 'preview-ready', machineType: 'slushie-machine', faultId: 'slushie-condenser-clogged', status: 'repaired' },
      ];
      startJob(state, faults['slushie-motor-brushes-worn'], 'workshop-preview-active', mulberry32('preview-workshop'));
      state.jobs.active.testsRun = ['error-log'];
      state.jobs.active.minutesSpent = 2;
    } else if (fixture === 'workshop-full') {
      state.workshop.machines = [
        { id: 'waiting-1', machineType: 'soft-serve-commercial', faultId: 'barrel-freeze-up', status: 'broken' },
        { id: 'waiting-2', machineType: 'slushie-machine', faultId: 'slushie-motor-brushes-worn', status: 'broken' },
        { id: 'ready-1', machineType: 'slushie-machine', faultId: 'slushie-condenser-clogged', status: 'repaired' },
        { id: 'ready-2', machineType: 'soft-serve-commercial', faultId: 'mix-feed-valve-stuck-closed', status: 'repaired' },
      ];
    } else if (fixture === 'prestige') {
      state.player.lifetimeEarnings = 34250;
      state.player.reputation = 128;
    }

    if (screen === 'job' && !state.jobs.active) {
      const previewFault = fixture === 'first'
        ? Object.values(faults).find((entry) => entry.tier === 1)
        : faults['barrel-freeze-up'];
      const previewClient = fixture === 'first'
        ? clients.find((entry) => entry.tier === 1)?.id
        : 'burgertown-high-st';
      if (fixture === 'callback-player') {
        startJob(state, previewFault, 'burgertown-high-st', mulberry32('preview-return'), {
          misses: 1,
          source: 'player',
          evidence: ['error-log'],
        });
      } else if (fixture === 'callback-tech') {
        startJob(state, previewFault, 'burgertown-high-st', mulberry32('preview-rescue'), {
          misses: 1,
          source: 'tech',
          techName: 'Dave',
        });
      } else if (fixture === 'motd') {
        startJob(state, previewFault, 'motd', mulberry32('preview-daily'), null, true, date(0));
      } else if (fixture === 'workshop-active') {
        // Already configured above.
      } else {
        startJob(state, previewFault, previewClient, mulberry32(`preview-${fixture}`));
      }
    }

    const actions = new Proxy({}, { get: () => noop });
    if (screen === 'home') {
      app.innerHTML = jobUi.homeView({
        state,
        faults,
        machines,
        clients,
        homePanels: {
          workshop: fixture.startsWith('workshop-'),
          prestige: fixture === 'prestige',
        },
        prestigeConfirm: params.has('confirm'),
        offlineReport: params.has('notices') ? {
          jobsDone: 11,
          totalEarned: 650,
          callbacksAdded: 1,
          techReports: [
            { name: 'Dave', routeId: 'burgertown-south', skill: 2, successRate: 0.9, perJob: 50, jobs: 7, callbacks: 1, earned: 300 },
            { name: 'Priya', routeId: 'froyo-strip', skill: 1, successRate: 0.75, perJob: 70, jobs: 5, callbacks: 0, earned: 350 },
          ],
        } : null,
      });
    } else if (screen === 'job') {
      app.innerHTML = jobUi.jobView({ state, faults, machines, clients });
    } else if (screen === 'callbacks') {
      app.innerHTML = jobUi.callbacksView({ state, faults, clients });
    } else if (screen === 'shop') {
      const purchaseNotice = fixture === 'first-tech-hired'
        ? { itemId: 'hire-tech-1' }
        : fixture === 'route-assignment'
          ? { itemId: 'route-froyo-strip' }
          : null;
      shopUi.render(app, { state, actions, purchaseNotice });
    } else if (screen === 'codex') {
      codexUi.render(app, { state, faults, machines, actions });
      const filter = params.get('filter');
      if (filter) app.querySelector(`[data-codex-filter="${filter}"]`)?.click();
    } else if (screen === 'invoice') {
      const fault = faults['barrel-freeze-up'];
      const miss = params.get('outcome') === 'miss';
      app.innerHTML = jobUi.invoiceView({
        state,
        invoice: {
          correct: !miss,
          fault,
          earned: miss ? 40 : 145,
          chosenFix: miss ? 'replace-beater-motor' : fault.correctFix,
          callback: false,
          callbackSource: null,
          unlockedTier: miss ? null : 3,
          isWorkshop: false,
          minutesSpent: 5,
          testsUsed: 1,
          repDelta: miss ? -2 : 1,
          cleanStreak: miss ? 0 : 7,
          codex: miss ? null : {
            isNew: true,
            mastered: 14,
            total: Object.keys(faults).length,
            milestonesPaid: [{ pct: 25, bonus: 250 }],
          },
          contract: miss ? null : {
            progress: 3,
            count: 3,
            justCompleted: true,
            reward: 180,
          },
        },
      });
    }
    const focus = params.get('focus');
    if (focus) {
      requestAnimationFrame(() => {
        app.querySelector(`[data-home-panel="${focus}"]`)?.scrollIntoView({ block: 'start' });
      });
    }
    document.body.dataset.viewportWidth = innerWidth;
  </script>
</body>
</html>
